base: Qwen/Qwen2.5-0.5B-Instruct
task: dpo
backend: transformers
modality: text
data:
  train: ./data/train.jsonl
  format: dpo
  val_split: 0.0
  max_length: 512
training:
  epochs: 1
  lr: 2.0e-5
  batch_size: 1
  gradient_accumulation_steps: 4
  seed: 42
  data_seed: 42
  dpo_beta: 0.1
  quantization: none
  stream_layers: true
  stream_source: ram
  stream_buffers: 2
  gradient_checkpointing: true
  use_flash_attn: false
  optimizer: adamw_torch
  logging_steps: 1
  save_steps: 100
  lora:
    r: 8
    alpha: 16
    dropout: 0.0
    target_modules: [q_proj, v_proj]
output: ./output
